<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع سعر العقار</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .result { margin-top: 20px; text-align: center; font-size: 20px; font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏠 توقع سعر العقار</h2>

    <div class="input-group">
        <label>الموقع (Location)</label>
        <select id="location">
            <option value="" disabled selected>جاري تحميل المواقع...</option>
        </select>
    </div>

    <div class="input-group">
        <label>عدد الغرف (BHK)</label>
        <input type="number" id="bhk" value="2" min="1">
    </div>

    <div class="input-group">
        <label>عدد الحمامات (Bathrooms)</label>
        <input type="number" id="bath" value="1" min="1">
    </div>

    <div class="input-group">
        <label>مساحة العقار بالمتر (Carpet Area)</label>
        <input type="number" id="carpet_area" value="120" min="20">
    </div>

    <div class="input-group">
        <label>مواقف السيارات (Parking)</label>
        <select id="parking">
            <option value="0">لا يوجد</option>
            <option value="1" selected>1 سيارة</option>
            <option value="2">2 سيارة فأكثر</option>
        </select>
    </div>

    <div class="input-group">
        <label>رقم الطابق (Floor Number)</label>
        <input type="number" id="floor_number" value="3" min="0">
    </div>

    <button onclick="predictPrice()">احسب السعر المتوقع</button>

    <div class="result" id="resultPrice"></div>
</div>

<script>
    // 🔧 غيّر الرابط ده بعد ما تعمل نشر (Deploy) للباك إند على Render
    // مثال بعد النشر: const API_BASE = 'https://house-price-backend.onrender.com';
    const API_BASE = 'http://127.0.0.1:5000';

    window.onload = async function() {
        try {
            const response = await fetch(`${API_BASE}/get_locations`);
            const data = await response.json();
            const locationSelect = document.getElementById('location');
            locationSelect.innerHTML = '';
            data.locations.forEach(loc => {
                let opt = document.createElement('option');
                opt.value = loc;
                opt.innerHTML = loc;
                locationSelect.appendChild(opt);
            });
        } catch (error) {
            console.error("Error loading locations:", error);
            document.getElementById('location').innerHTML = '<option>تأكد من تشغيل السيرفر (Flask)</option>';
        }
    };

    async function predictPrice() {
        const resultDiv = document.getElementById('resultPrice');
        resultDiv.innerHTML = "جاري الحساب... ⏳";

        const requestData = {
            location: document.getElementById('location').value,
            bhk: document.getElementById('bhk').value,
            bath: document.getElementById('bath').value,
            carpet_area: document.getElementById('carpet_area').value,
            parking: document.getElementById('parking').value,
            floor_number: document.getElementById('floor_number').value
        };

        try {
            const response = await fetch(`${API_BASE}/predict_price`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });
            const data = await response.json();

            if(data.error) {
                resultDiv.innerHTML = "حدث خطأ: " + data.error;
            } else {
                resultDiv.innerHTML = "السعر المتوقع: " + data.estimated_price.toLocaleString() + " جنيه";
            }
        } catch (error) {
            console.error("Error:", error);
            resultDiv.innerHTML = "❌ فشل الاتصال بالسيرفر";
        }
    }
</script>

</body>
</html>
